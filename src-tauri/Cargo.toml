[package]
name = "chinnu-healthai"
version = "0.1.0"
description = "Chinnu HealthAI cross-platform health companion"
authors = ["Chinnu HealthAI"]
edition = "2021"

[lib]
name = "chinnu_healthai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
